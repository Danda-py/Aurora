<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="auroraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
    <linearGradient id="mountainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
  </defs>
  <!-- Background with slight rounding -->
  <rect width="512" height="512" rx="110" fill="url(#auroraGrad)" />
  
  <!-- Sun / Aurora warm circle -->
  <circle cx="256" cy="220" r="110" fill="url(#sunGrad)" opacity="0.9" />

  <!-- Mountain Silhouettes (Valtellina Alps) -->
  <polygon points="60,390 190,210 280,330 330,270 452,390" fill="#134e4a" opacity="0.6" />
  <polygon points="120,390 230,240 310,340 370,270 480,390" fill="#042f2e" opacity="0.8" />
  
  <!-- Mountain snow cap -->
  <polygon points="230,240 205,275 220,270 230,280 242,268 255,275" fill="url(#mountainGrad)" />

  <!-- Cozy Chalet / House icon in foreground -->
  <path d="M256 260 L350 340 L330 340 L330 420 L182 420 L182 340 L162 340 Z" fill="#ffffff" filter="drop-shadow(0px 8px 16px rgba(0,0,0,0.25))" />
  <!-- House Door & Window -->
  <rect x="236" y="360" width="40" height="60" rx="4" fill="#0f766e" />
  <rect x="200" y="320" width="28" height="28" rx="4" fill="#ca8a04" />
  <rect x="284" y="320" width="28" height="28" rx="4" fill="#ca8a04" />

  <!-- Text / Monogram -->
  <text x="256" y="470" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="34" fill="#ffffff" letter-spacing="4">AURORA</text>
</svg>
